services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
        VITE_HEMLE_GOOGLE_FORM_URL: ${VITE_HEMLE_GOOGLE_FORM_URL:-}
        VITE_HEMLE_WHATSAPP_URL: ${VITE_HEMLE_WHATSAPP_URL:-}
        VITE_HEMLE_EMAIL: ${VITE_HEMLE_EMAIL:-}
        VITE_HEMLE_MAGAZINE_URL: ${VITE_HEMLE_MAGAZINE_URL:-}
        VITE_HEMLE_FACEBOOK_URL: ${VITE_HEMLE_FACEBOOK_URL:-}
        VITE_HEMLE_INSTAGRAM_URL: ${VITE_HEMLE_INSTAGRAM_URL:-}
        VITE_HEMLE_LINKEDIN_URL: ${VITE_HEMLE_LINKEDIN_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      BOOTSTRAP_ADMIN_ID: ${BOOTSTRAP_ADMIN_ID:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FORCE_PASSWORD: ${BOOTSTRAP_ADMIN_FORCE_PASSWORD:-false}
    restart: unless-stopped
